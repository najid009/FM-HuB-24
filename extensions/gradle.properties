org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Must match android-app/gradle.properties exactly, otherwise extensions compile against one
# API and run against another (that mismatch is what shows up as a class that "won't link").
CLOUDSTREAM_VERSION=v4.8.0
PLUGIN_API_VERSION=1

# Version written into manifest.json / plugins.json for every module here. Bump on each release:
# the app only re-downloads a cached plugin when this number is greater than what it already has.
EXTENSION_VERSION=1
