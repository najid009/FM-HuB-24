name: Rust Provider Migration CI

on:
  push:
    branches:
      - rust-provider-migration
    paths:
      - 'rust-core/**'
      - 'android-app/**'
      - '.github/workflows/rust-provider-migration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'rust-core/**'
      - 'android-app/**'
      - '.github/workflows/rust-provider-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust format and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run unit tests
        run: cargo test --locked

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Configure SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fmhub24-migration-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
