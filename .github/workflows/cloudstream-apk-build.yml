name: FMHuB24 CloudStream APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app-cloudstream/**'
      - 'supabase/functions/tmdb-trending/**'
      - '.github/workflows/cloudstream-apk-build.yml'

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configure Android SDK and release keystore
        working-directory: android-app-cloudstream
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p "$HOME/work/_temp/keystore"
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/work/_temp/keystore/fmhub24-release.jks"
          chmod 600 "$HOME/work/_temp/keystore/fmhub24-release.jks"

      - name: Build signed stable release APK
        working-directory: android-app-cloudstream
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FMHUB_KEYSTORE_PATH: ${{ runner.temp }}/keystore/fmhub24-release.jks
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FMHUB_REPOSITORY_CONFIG_URL: ${{ secrets.FMHUB_REPOSITORY_CONFIG_URL }}
          FMHUB_CATALOG_CONFIG_URL: ${{ secrets.FMHUB_CATALOG_CONFIG_URL }}
          FMHUB_TMDB_TRENDING_URL: ${{ secrets.FMHUB_TMDB_TRENDING_URL }}
        run: ./gradlew :app:assembleStableRelease --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p artifact
          cp android-app-cloudstream/app/build/outputs/apk/stable/release/*.apk artifact/FMHuB24-release.apk
          sha256sum artifact/FMHuB24-release.apk | tee artifact/SHA256SUMS.txt

      - name: Upload signed FMHuB24 APK
        uses: actions/upload-artifact@v4
        with:
          name: fmhub24-signed-release-apk
          path: artifact/
          retention-days: 30
