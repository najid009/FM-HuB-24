name: FMHuB24 CloudStream APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app-cloudstream/**'
      - '.github/workflows/cloudstream-apk-build.yml'

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configure Android SDK
        working-directory: android-app-cloudstream
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build stable debug APK
        working-directory: android-app-cloudstream
        run: ./gradlew :app:assembleStableDebug --no-daemon --stacktrace

      - name: Rename APK for download
        run: |
          mkdir -p artifact
          cp android-app-cloudstream/app/build/outputs/apk/stable/debug/*.apk artifact/FMHuB24-cloudstream-debug.apk
          sha256sum artifact/FMHuB24-cloudstream-debug.apk | tee artifact/SHA256SUMS.txt

      - name: Upload FMHuB24 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fmhub24-cloudstream-debug-apk
          path: artifact/
          retention-days: 30
