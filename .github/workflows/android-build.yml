name: Android APK Build

on:
  push:
    branches: [ main, arena/* ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        # No gradle-version here: AGP 8.13 requires Gradle 8.13+, and that is exactly what
        # android-app/gradle/wrapper/gradle-wrapper.properties pins. Letting the wrapper drive
        # means CI, the sandbox and a laptop all resolve the same toolchain.
        uses: gradle/actions/setup-gradle@v4

      - name: Show Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms/ || true
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          sdkmanager --version || true

      - name: Create local.properties with secrets
        # Values go in through `env`, never through interpolation: `${{ secrets.X }}` inside a shell
        # string is (a) expanded before masking applies and (b) a shell-injection path if a secret
        # ever contains a quote. And no `cat local.properties`: echoing the anon key into the Actions
        # log puts a credential in a place every viewer of the run can read.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder-key}"
          } > local.properties
          echo "local.properties: $(grep -c '^[A-Za-z]' local.properties) keys set"

      - name: Install Android SDK components
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          # Must cover the app compileSdk (36).
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || echo "no gradlew"

      # API-level check first: it is the one class of bug that compiles, passes every unit of
      # review, and then crashes the moment the app opens on an older device.
      - name: Lint (NewApi against minSdk)
        working-directory: android-app
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Build Debug APK
        id: build_debug
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== BUILD.LOG (last 300 lines) ==="
          tail -n 300 "$GITHUB_WORKSPACE/build.log" || cat "$GITHUB_WORKSPACE/build.log" || echo "no log"
          echo "=== END LOG ==="

      - name: Comment PR with build log on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              // Every Gradle step appends to one file at the workspace root, so a failure in any of
              // them (lint, debug, release) is readable in the PR — the Actions log itself lives on a
              // blob host that is often unreachable.
              log = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/build.log', 'utf8');
            } catch (e) {
              log = 'Could not read build.log: ' + e.message;
            }
            // Truncate to 60000 chars for comment
            const truncated = log.slice(-60000);
            const body = `❌ Android build failed\n\n<details><summary>Build log (last 60k chars)</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmhub24-debug-apk
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            ${{ github.workspace }}/build.log
          retention-days: 30
          if-no-files-found: warn

      # No release build here, on purpose: an unsigned release APK is uninstalled on sight, and the
      # debug artifact above is what both CI and the phone test use. Release signing stays a local
      # decision (keystore, minify, ProGuard rules) rather than a workflow that half-does it.
