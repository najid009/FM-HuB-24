name: Extensions Build

# Builds every extension module into a .cs3, packs them into a CloudStream-style repository
# (repo.json + plugins.json + packages) and uploads the result. Pushing the output to the
# `builds` branch — which is what the admin panel links to — only happens on a manual run,
# so a normal commit can never overwrite a published repository.

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'android-app/plugin-api/**'
      - 'android-app/gradle.properties'
      - '.github/workflows/extensions-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extensions/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the built repository to the builds branch'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle
        # The wrapper in each project decides the Gradle version; AGP 8.13 needs 8.13+.
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties

      # ---------------------------------------------------------------- plugin API
      # Extensions compile against com.fmhub24.pluginapi:plugin-api, resolved from mavenLocal.
      # Publish it first, in the same job, or the extension build cannot resolve the contract.
      # `set -o pipefail` matters: without it, tee swallows Gradle's exit code and a broken build
      # would report success.
      - name: Publish plugin-api to mavenLocal
        working-directory: android-app
        run: |
          set -o pipefail
          ./gradlew :plugin-api:publishToMavenLocal --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # ---------------------------------------------------------------- extensions
      - name: Build .cs3 packages
        working-directory: extensions
        run: |
          set -o pipefail
          ./gradlew make --no-daemon --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Generate plugins.json
        working-directory: extensions
        run: |
          set -o pipefail
          ./gradlew writeCacheEntry makePluginsJson --no-daemon --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Pack repository (repo.json + sha256 + stored dex)
        working-directory: extensions
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          BASE="https://raw.githubusercontent.com/$OWNER/$REPO/builds"
          python3 tools/make_repo.py \
            --base-url "$BASE" \
            --name "FMHub24 Extensions" \
            --out dist
          echo "--- repo.json ---"; cat dist/repo.json
          echo "--- plugins.json ---"; cat dist/plugins.json
          ls -la dist

      - name: Verify every package is loadable-shaped
        working-directory: extensions
        run: |
          python3 - <<'PY'
          import json, sys, zipfile
          entries = json.load(open('dist/plugins.json'))
          if not entries:
              sys.exit('plugins.json is empty — no extension module produced a package')
          for entry in entries:
              path = entry['url'].rsplit('/', 1)[-1]
              with zipfile.ZipFile(f'dist/{path}') as z:
                  names = z.namelist()
                  if 'classes.dex' not in names:
                      sys.exit(f'{path}: no classes.dex')
                  if z.getinfo('classes.dex').compress_type != 0:
                      # Not fatal: every community .cs3 is deflated and our host loads those. STORED is
                      # what make_repo.py repacks to, so a compressed one here means the repack step
                      # was skipped - say so instead of failing on a claim that is not true.
                      print(f'note: {path}: classes.dex is not STORED (fine for FMHub24, not for a client that mmaps it)')
                  manifest = json.loads(z.read('manifest.json'))
                  if not manifest.get('pluginClassName'):
                      sys.exit(f'{path}: manifest.json has no pluginClassName')
                  if manifest.get('fmhubApiVersion') != 1:
                      sys.exit(f'{path}: manifest.json fmhubApiVersion must be 1, got {manifest.get("fmhubApiVersion")}')
              print(f'ok: {path} ({" ".join(sorted(names))})')
          PY

      # The Actions log lives on a blob host that is not always reachable; a PR comment is, and it
      # is where a reviewer looks when this job is red.
      - name: Comment PR with the build log on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 "$GITHUB_WORKSPACE/build.log" > /tmp/tail.log || true
          {
            echo "❌ Extensions build failed. Last lines of the Gradle log:"
            echo
            echo '```'
            cat /tmp/tail.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: fmhub24-extension-repo
          path: extensions/dist
          retention-days: 30

      # ---------------------------------------------------------------- optional publish
      - name: Publish to the builds branch
        # An orphan branch holding only repo.json + plugins.json + *.cs3 — that is the shape a
        # raw.githubusercontent.com/OWNER/REPO/builds/repo.json link expects. Force push because the
        # branch is generated, never edited: its history has no value and keeping it would grow the
        # repo by every binary ever published.
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          git init -q "$tmp"
          cp extensions/dist/* "$tmp/"
          {
            echo "FMHub24 extension repository - generated by .github/workflows/extensions-build.yml"
            echo "from commit $GITHUB_SHA. Do not edit by hand."
          } > "$tmp/README.md"
          cd "$tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b builds
          git add -A
          git commit -q -m "extensions: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" builds:builds
          echo "Published. Repo link for the admin panel:"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/builds/repo.json"
