org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRResources=true
kotlin.code.style=official
android.nonFinalResIds=false

# ---------------------------------------------------------------------------
# Extension/plugin system (shared by :app and :plugin-api)
# ---------------------------------------------------------------------------
# The exact CloudStream revision the host API is compiled against. Community .cs3 files
# are built against this library, so every extension you want to run must be built against
# THE SAME version. Bumping this = rebuilding/pinning your own extensions too.
CLOUDSTREAM_VERSION=v4.8.0

# Our own plugin contract version. Written into repo.json/plugins.json we publish and
# checked by the host at load time (see FMHubApi.API_VERSION) so a mismatched extension is
# reported as "built for a different FMHub API" instead of silently failing to link.
PLUGIN_API_VERSION=1

# Used by the extensions project (../extensions) so both sides always agree.
PLUGIN_API_GROUP=com.fmhub24.pluginapi
PLUGIN_API_ARTIFACT=plugin-api
