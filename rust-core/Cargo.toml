[package]
name = "fmhub-provider-core"
version = "0.1.0"
edition = "2021"
description = "Typed, in-process provider core for FM-HuB-24 Android"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync"] }
url = "2"

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Provider source is configured at build time or by the native Android bridge.
# No credentials or executable code are downloaded at runtime.
